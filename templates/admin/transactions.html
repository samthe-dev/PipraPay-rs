{% extends "admin/base.html" %}
{% block content %}
<h1 style="margin-top:0;">Transactions</h1>
<div class="card">
  <form method="get" action="/admin/transactions">
    <select name="status">
      <option value="">All statuses</option>
      <option value="initiated" {% if filter == "initiated" %}selected{% endif %}>initiated</option>
      <option value="pending" {% if filter == "pending" %}selected{% endif %}>pending</option>
      <option value="completed" {% if filter == "completed" %}selected{% endif %}>completed</option>
      <option value="refunded" {% if filter == "refunded" %}selected{% endif %}>refunded</option>
      <option value="canceled" {% if filter == "canceled" %}selected{% endif %}>canceled</option>
    </select>
    <button type="submit">Filter</button>
  </form>
</div>
<div class="card">
  <table>
    <tr><th>Ref</th><th>Customer</th><th>Amount</th><th>Status</th><th>Date</th></tr>
    {% for t in rows %}
    <tr>
      <td><code>{{ t.ref_ }}</code></td>
      <td>{{ t.customer }}</td>
      <td>{{ t.amount }} {{ t.currency }}</td>
      <td><span class="pill {{ t.status }}">{{ t.status }}</span></td>
      <td>{{ t.created }}</td>
    </tr>
    {% endfor %}
  </table>
  {% if rows.is_empty() %}<p>No transactions found.</p>{% endif %}
</div>
{% endblock %}
