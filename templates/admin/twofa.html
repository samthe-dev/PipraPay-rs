<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two-factor authentication — PipraPay Admin</title>
<style>
body { font-family: system-ui, sans-serif; background: #f6f7f9; display: flex; justify-content: center; padding-top: 12vh; margin: 0; }
.card { background: #fff; border: 1px solid #e5e7eb; border-radius: 10px; padding: 24px; width: 340px; }
input, button { font: inherit; width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; }
button { background: #111827; color: #fff; border: none; cursor: pointer; }
.error { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; padding: 10px; border-radius: 6px; margin-bottom: 12px; }
label { font-weight: 600; font-size: 14px; }
</style>
</head>
<body>
<div class="card">
  <h1 style="margin-top:0;">Two-factor authentication</h1>
  <p>Enter the 6-digit code from your authenticator app.</p>
  {% if let Some(e) = error %}<div class="error">{{ e }}</div>{% endif %}
  <form method="post" action="/admin/2fa">
    <label>Code</label>
    <input name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required>
    <button type="submit">Verify</button>
  </form>
</div>
</body>
</html>
